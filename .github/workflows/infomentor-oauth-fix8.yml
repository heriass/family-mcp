name: InfoMentor OAuth fix8 static musl Linux release
on:
  push:
    branches: [infomentor-fix8]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  linux-x64:
    if: github.repository == 'heriass/family-mcp'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Install static musl linker and target
        working-directory: rust
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
          rustup toolchain install
          rustup target add x86_64-unknown-linux-musl
      - name: Check and test InfoMentor
        working-directory: rust
        run: |
          cargo fmt --package infomentor-mcp
          cargo fmt --check
          cargo clippy -p infomentor-mcp --all-targets --all-features --locked -- -D warnings
          FAMILY_MCP_BUN="$(command -v bun)" cargo test -p infomentor-mcp --all-features --locked --no-fail-fast
      - name: Build and verify static Linux x64 archive
        working-directory: packages/infomentor-mcp
        run: |
          bun run release:check
          bun run build:binary
          bun run test:binary
          bun run test:installer
          cd release
          sha256sum -c infomentor-mcp-0.9.1-linux-x64.tar.gz.sha256
          tar -tzf infomentor-mcp-0.9.1-linux-x64.tar.gz
          tar -tzf infomentor-mcp-0.9.1-linux-x64.tar.gz | grep -Fx 'infomentor-mcp/bin/infomentor-mcp'
          file native/infomentor-mcp | grep -E 'statically linked|static-pie linked'
      - name: Publish fix8 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<'EOF'
          Assignment details read correctly, based on infomentor-mcp@0.9.1-oauth-fix7. Executable version remains 0.9.1. InfoMentor reads a task with POST {"taskId": id} to task/getTask, as its web app does; fix7 appended the ID to the path, which InfoMentor answered with a redirect. get_assignment, the per-item details of get_assignments and app_get getTask with an id now send the taskId body. Other apps are unchanged.


          Assets preserve upstream names and layout: infomentor-mcp-0.9.1-linux-x64.tar.gz, its .sha256 sidecar, binary at infomentor-mcp/bin/infomentor-mcp. Linux x64 is statically linked (musl).
          EOF
          gh release create 'infomentor-mcp@0.9.1-oauth-fix8' packages/infomentor-mcp/release/infomentor-mcp-0.9.1-linux-x64.tar.gz packages/infomentor-mcp/release/infomentor-mcp-0.9.1-linux-x64.tar.gz.sha256 --target "$GITHUB_SHA" --title 'infomentor-mcp 0.9.1 — OAuth fix8 (static linux-x64)' --notes-file "$RUNNER_TEMP/notes.md"
