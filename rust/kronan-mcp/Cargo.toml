[package]
name = "kronan-mcp"
# Kept equal to packages/kronan-mcp/package.json; a test compares them.
version = "0.3.2"
description = "Unofficial Krónan grocery MCP server for products, the shopping note, the basket, and confirmed orders"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Test seam only: KRONAN_TEST_ORIGIN redirects requests (never the token's destination host) to a
# local fake upstream. Off by default, so a release build always talks to https://api.kronan.is.
test-origin = []

[dependencies]
# SHA-256 for the order-attempt fingerprint TypeScript computes with node:crypto; the same crate
# and features rustls already builds.
aws-lc-rs = { version = "=1.18.1", default-features = false, features = ["aws-lc-sys", "prebuilt-nasm"] }
family-store = { path = "../family-store" }
# `\p{L}`/`\p{N}` for the slug pattern; already in the lock through reqwest's URL handling.
# Order-attempt ids, as crypto.randomUUID.
getrandom = "=0.4.3"
icu_properties = { version = "=2.3.0", default-features = false, features = ["compiled_data"] }
mcp-runtime = { path = "../mcp-runtime" }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }
# Raw terminal mode for the hidden token prompt (`termios` only adds rustix's own module).
rustix = { version = "=1.1.5", default-features = false, features = ["std", "termios"] }
rmcp = { version = "=3.5.1", default-features = false, features = ["server"] }
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
tokio = { version = "=1.53.2", features = ["rt", "macros", "signal", "sync", "time"] }

[dev-dependencies]
# Its unit tests open scratch stores in their own process, with the store test seam on.
family-store = { path = "../family-store", features = ["test-seam"] }
# A pseudo-terminal for the hidden-prompt test.
rustix = { version = "=1.1.5", default-features = false, features = ["std", "pty", "termios"] }
