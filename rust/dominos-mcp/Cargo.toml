[package]
name = "dominos-mcp"
version = "0.2.1"
description = "Unofficial Domino’s Iceland MCP server"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Loopback fake upstream only; release builds never enable it.
test-origin = []

[dependencies]
getrandom = "=0.4.3"
family-store = { path = "../family-store" }
mcp-runtime = { path = "../mcp-runtime" }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }
rmcp = { version = "=3.5.1", default-features = false, features = ["server"] }
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
tokio = { version = "=1.53.2", features = ["rt", "macros", "signal", "sync", "time"] }
url = "=2.5.8"

rustix = { version = "=1.1.5", default-features = false, features = ["std", "termios"] }

[dev-dependencies]
family-store = { path = "../family-store", features = ["test-seam"] }
rustix = { version = "=1.1.5", default-features = false, features = ["std", "termios", "pty"] }
