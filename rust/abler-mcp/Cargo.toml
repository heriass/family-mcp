[package]
name = "abler-mcp"
# Kept equal to packages/abler-mcp/package.json; a test compares them.
version = "0.7.2"
description = "Unofficial, read-only Abler schedules and messages MCP server"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Test seam only: ABLER_TEST_ORIGIN redirects requests (never cookies) to a local fake upstream.
# Off by default, so a release build always talks to https://www.abler.io.
test-origin = []

[dependencies]
browser-login = { path = "../browser-login" }
family-store = { path = "../family-store" }
# Only to recognise a response head too large to read: `Error::is_parse` plus that kind's fixed
# text, because `Error::is_parse_too_large` needs hyper's `server` feature.
hyper = { version = "=1.12.0", default-features = false }
mcp-runtime = { path = "../mcp-runtime" }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }
rustix = { version = "=1.1.5", default-features = false, features = ["std", "fs", "process"] }
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "transport-io"] }
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
tokio = { version = "=1.53.2", features = ["rt", "io-std", "macros", "signal", "sync", "time"] }
# The debugging socket of `auth capture`; plain ws:// to loopback only, so no TLS feature.
tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }

[dev-dependencies]
# Its unit tests open scratch stores in their own process, with the store test seam on.
family-store = { path = "../family-store", features = ["test-seam"] }
