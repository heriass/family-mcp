[package]
name = "family-store"
version = "0.0.0"
description = "Encrypted session records shared with the TypeScript session-store package"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Test seam only: `enable_test_seam` turns the store test seam on inside a test process, which
# cannot set its own environment, and `after_identity` pauses the startup check between two
# metadata reads. Off by default, so neither exists in `cargo build` or `cargo run`; this crate's
# own tests turn it on below.
test-seam = []

[dependencies]
aes-gcm = { version = "=0.11.1", default-features = false, features = ["aes", "alloc", "zeroize"] }
base64 = { version = "=0.23.1", default-features = false, features = ["alloc"] }
getrandom = "=0.4.3"
rustix = { version = "=1.1.5", default-features = false, features = ["std", "fs", "process"] }
zeroize = { version = "=1.9.1", default-features = false }

[dev-dependencies]
family-store = { path = ".", features = ["test-seam"] }
# Reads the frozen TypeScript store states (tests/fixtures/store/states.json); already in the lock
# through the servers.
serde_json = "=1.0.151"
