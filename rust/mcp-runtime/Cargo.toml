[package]
name = "mcp-runtime"
version = "0.1.0"
description = "The shared MCP server runtime of the native servers: packages/mcp-runtime in Rust"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "transport-io"] }
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
# `fs`: stdout is written through its own copy of descriptor 1 (src/stdio.rs `Output`).
tokio = { version = "=1.53.2", features = ["fs", "rt", "io-std", "macros", "signal", "sync", "time"] }

[dev-dependencies]
# Only for its re-exported `http::Response`, from which a test builds a `reqwest::Response`.
hyper = { version = "=1.12.0", default-features = false }
# Signals the example server in tests/signals.rs.
rustix = { version = "=1.1.5", default-features = false, features = ["std", "process"] }
